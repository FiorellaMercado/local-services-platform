<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="js/proveedor.js"></script>
</head>
<body class="min-h-screen py-6 px-10 max-w-7xl mx-auto">
    <main>
        <section class="bg-gray-100 p-6 rounded-xl mb-5">
            <p id="ui-state"></p>
            <h1 id="name" class="text-3xl font-bold mb-3"></h1>
            <p id="category"></p>
            <p class="text-sm text-gray-500 hover:underline" id="phone"></p>
            <span class="text-gray-600" id="rating"></span>
            <span class="text-gray-600" id="reviews-count"></span>
            <p class="mt-4" id="description"></p>
            
        </section>
        
        <section class=" p-6 rounded-xl mb-10">
            <h2 class="text-2xl font-bold text-gray-800 mb-5">Reseñas</h2>
            <div id="reviews" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

        <section class="bg-gray-100 p-6 rounded-xl mb-10 w-full max-w-sm mx-auto">
            <form id="review-form" class="flex flex-col gap-5 ">
                <h2 class="text-2xl font-bold mb-6">Deja tu resena</h2>
                <div class="flex flex-col gap-2">
                    <label for="form-author">Nombre:</label>
                    <input type="text" name="autor" id="form-author" minlength="2" maxlength="60" required
                    class="bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="form-rating">Calificacion</label>
                    <input type="number" name="rating" id="form-rating" min="1" max="5" step="1" required
                    class="bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                </div>
                <div class="flex flex-col gap-2">
                    <label for="form-comment">Comentario</label>
                    <input type="text" name="comment" id="form-comment" maxlength="200"
                    class="bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button class="bg-black text-white py-3 px-5 rounded-lg hover:bg-gray-700 transition-colors" id="review-button" type="submit">Enviar</button>
            </form>
            <p id="review-message"></p>
    </section>
    </main>
</body>
</html>
